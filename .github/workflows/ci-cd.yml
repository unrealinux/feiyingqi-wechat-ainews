name: AI News Publisher CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # NOTE: daily `schedule` trigger was removed on purpose:
  #  - running `main.py run` from a GitHub runner IP fails the WeChat API IP
  #    whitelist, and
  #  - auto-publishing on a timer violates AGENTS.md (max 1 draft/day, human
  #    review before drafting). Scheduling lives in Windows Task Scheduler
  #    (scripts/win/register-task.ps1), not in CI.

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        # 版本固定：black 的格式化规则会随版本变化，浮动版本会让
        # 「本地格式化过、CI 说没格式化过」反复出现。
        run: |
          pip install "black==26.10.1" "flake8==7.4.1"

      # 这一步是真门禁：全仓已跑过一次 black，从此保持干净是可做到的。
      - name: Check formatting
        run: black --check src/ main.py

      # 这一步只提示，不阻塞：现状还有约 166 条 flake8 提示（81 个未使用导入、
      # 34 处空行带空白、8 处裸 except、8 处赋值后未使用的局部变量…）。
      # 其中裸 except 要逐处判断该收窄成哪种异常，不适合一次性机械改完，
      # 所以先让它看得见但不拦人，别把一个必然失败的门禁挂在那里。
      - name: Run linters (advisory)
        continue-on-error: true
        run: |
          flake8 src/ main.py --max-line-length=120 --ignore=E501,W503
          mypy src/ --ignore-missing-imports

  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ainews-publisher:${{ github.sha }} .
          docker build -t ainews-publisher:latest .

  docker-push:
    runs-on: ubuntu-latest
    needs: [test]
    # 没配 Docker Hub 凭据时跳过：否则每次推送都在 "Username and password
    # required" 上失败，红灯变成常态之后没人再看这个 pipeline。
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ainews/publisher:${{ github.sha }}
            ainews/publisher:latest
