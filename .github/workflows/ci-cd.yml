name: AI News Publisher CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # NOTE: daily `schedule` trigger was removed on purpose:
  #  - running `main.py run` from a GitHub runner IP fails the WeChat API IP
  #    whitelist, and
  #  - auto-publishing on a timer violates AGENTS.md (max 1 draft/day, human
  #    review before drafting). Scheduling lives in Windows Task Scheduler
  #    (scripts/win/register-task.ps1), not in CI.

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  lint:
    runs-on: ubuntu-latest
    # Advisory only: the codebase is not black-formatted yet, so lint must not
    # block builds. Flip continue-on-error to false once `black src/ main.py`
    # has been run once and kept clean.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          pip install flake8 black mypy

      - name: Check formatting
        run: |
          black --check src/ main.py

      - name: Run linters
        run: |
          flake8 src/ main.py --max-line-length=120 --ignore=E501,W503
          mypy src/ --ignore-missing-imports || true

  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ainews-publisher:${{ github.sha }} .
          docker build -t ainews-publisher:latest .

  docker-push:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ainews/publisher:${{ github.sha }}
            ainews/publisher:latest
